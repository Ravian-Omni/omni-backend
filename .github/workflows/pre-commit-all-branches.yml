name: Pre-Commit Checks (All Branches)

on:
  push:
    branches: ['**']  # All branches
  pull_request:
    branches: ['**']  # All PRs

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # ✨ NEW: Fetch full history for better pre-commit performance
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # ✨ NEW: Install all required dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit detect-secrets

      # ✨ NEW: Create secrets baseline before running pre-commit
      - name: Setup secrets baseline
        run: |
          if [ ! -f .secrets.baseline ]; then
            detect-secrets scan --exclude-files 'package-lock\.json|poetry\.lock|Pipfile\.lock|tests/fixtures/.*|build_scripts/.*|scripts/.*|.*\.sh|.*\.md' > .secrets.baseline
          fi

      # ✨ MODIFIED: Simplified pre-commit run
      - name: Run pre-commit on all files
        run: |
          pre-commit run --all-files --show-diff-on-failure

      # ✨ NEW: Auto-commit formatting fixes (optional but recommended)
      # - name: Auto-commit pre-commit fixes
      #   if: failure()
      #   run: |
      #     git config --local user.email "github-actions[bot]@users.noreply.github.com"
      #     git config --local user.name "github-actions[bot]"
      #     git add -A
      #     if ! git diff --quiet || ! git diff --staged --quiet; then
      #       git commit -m "style: auto-fix pre-commit issues [skip ci]"
      #       git push
      #     fi
      #   continue-on-error: true

      # ✨ MODIFIED: Enhanced PR comment with more details
      - name: Comment on PR with failures (if PR)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Pre-commit checks failed!**

            ## Run locally to fix:
            \`\`\`bash
            # Install pre-commit
            pip install pre-commit detect-secrets

            # Setup hooks
            pre-commit install

            # Create secrets baseline if needed
            detect-secrets scan > .secrets.baseline

            # Run all checks
            pre-commit run --all-files

            # Stage and commit fixes
            git add .
            git commit -m "Fix pre-commit issues"
            \`\`\`

            ## Enabled hooks:
            - ✅ autoflake (remove unused imports)
            - ✅ isort (sort imports)
            - ✅ black (code formatting)
            - ✅ flake8 (linting)
            - ✅ bandit (security)
            - ✅ detect-secrets (credential scanning)
            - ✅ pydocstyle (docstring conventions)
            - ✅ pyupgrade (syntax upgrades)

            See the [Actions log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`
            })
