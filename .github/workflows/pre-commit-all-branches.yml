name: Pre-Commit Checks (All Branches)

on:
  push:
    branches: ['**']  # All branches
  pull_request:
    branches: ['**']  # All PRs

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: |
          # Create secrets baseline if it doesn't exist
          if [ ! -f .secrets.baseline ]; then
            pip install detect-secrets
            detect-secrets scan > .secrets.baseline
          fi

          # Run pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Comment on PR with failures (if PR)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Pre-commit checks failed!**\n\nRun locally to fix:\n```bash\npip install pre-commit\npre-commit install\npre-commit run --all-files\n```'
            })
